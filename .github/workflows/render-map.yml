name: Render Map

on:
  push:
    paths:
      - 'data/**'
      - 'script.R'
      - 'MAPS/**'
      - 'Logo_PuP.png'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: System dependencies (sf)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install R packages
        run: |
          R -e "install.packages(c('readxl','dplyr','leaflet','leaflet.extras','htmltools','htmlwidgets','widgetframe','sf'), repos='https://cloud.r-project.org')"

      - name: Run script
        run: Rscript script.R

      - name: Commit output
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git add output/karte_marker.html
          git commit -m "update map" || echo "no changes"
          git push
